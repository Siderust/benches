# Siderust Lab — Capability Catalog
# ----------------------------------
# This file is the single source of truth for what the lab publishes.
# Every (candidate_id, experiment) tuple that ever appears in a scorecard
# row MUST also appear here, with an explicit upstream API reference.
#
# Schema (per [[candidate]] entry):
#   id              — stable identifier ("library[:variant]"); appears as
#                     candidate_id in result JSON and as the row key in
#                     scorecards. The same id may appear in multiple [[candidate]]
#                     blocks only when experiments do not overlap; uniqueness is
#                     enforced per (candidate_id, experiment) tuple.
#   library         — the upstream library this candidate belongs to.
#   display         — short human-readable name shown in the dashboard.
#   description     — one-sentence description of what the candidate is.
#   experiments     — list of experiment IDs this candidate participates in
#                     (use the canonical experiment ID, e.g. solar_position).
#   api_surface     — "public"     ⇒ exported library function on a stable
#                                    public API,
#                     "reference"  ⇒ wrapper of the SOFA / IAU reference
#                                    implementation (ERFA), used as
#                                    reference column only,
#                     "diagnostic" ⇒ internal-only / opt-in profile, never
#                                    in the public scoreboard.
#   api_method      — exact upstream symbol(s) called.  This is the line
#                     the paper cites when claiming "the lab measures the
#                     library's published API and not a hand-rolled
#                     reimplementation".
#   model           — model identifier ("VSOP87", "ELP2000-82B", "JPL DE440",
#                     "JPL DE430", "Astropy builtin (DE405-like)", etc.).
#   source          — provenance (kernel file / table / textbook).
#   lane            — "geometric_vector" | "apparent_observer".
#   parity          — comparability tag against the JPL Horizons DE441
#                     reference row.  Allowed values:
#                       "exact-same-kernel" ⇒ candidate resolves the *identical*
#                                             kernel/model as the reference
#                                             (e.g. a true DE441 candidate),
#                       "same-family-jpl"   ⇒ a JPL DE kernel of a different
#                                             version than the reference
#                                             (DE440 vs the DE441 reference):
#                                             ranked in the broad view but never
#                                             crowned in the strict exact-model
#                                             view,
#                       "best-available"    ⇒ different model, same observable,
#                       "model-mismatch"    ⇒ not comparable,
#                       "diagnostic-only"   ⇒ shown, never ranked,
#                       "reference"         ⇒ the reference row itself.
#   support         — "supported"        ⇒ ranked,
#                     "runtime-blocked"  ⇒ candidate is intentionally not
#                                          published because of an upstream
#                                          bug or missing data,
#                     "unsupported"      ⇒ no API path in this library.
#   exclusion_reason — required when support != "supported"; recorded in
#                      the result JSON and surfaced in the dashboard.
#
# IMPORTANT INVARIANTS (enforced by pipeline/tests/test_catalog_truth.py):
#   1. No entry has api_surface = "public" with api_method that names a
#      symbol not exported by the upstream library.
#   2. No entry has support = "supported" if its api_method is a Newton /
#      bisection iteration written inside the adapter.
#   3. libnova never has parity = "jpl-spk".
#   4. erfa entries are always api_surface = "reference" (never "public").
#
# Add new entries here only after auditing the upstream API and recording
# the exact symbol invoked.  Do NOT add a row to make a tool "look good"
# in the dashboard — fabricated rows fail the truth tests.

# ---------------------------------------------------------------------------
# siderust — VSOP87 / Meeus / IAU profiles (default geometric models)
# ---------------------------------------------------------------------------

[[candidate]]
id          = "siderust"
library     = "siderust"
display     = "siderust (VSOP87 + Meeus, IAU 2006A)"
description = "Default siderust build: VSOP87 planets, Meeus Ch. 47 lunar, IAU 2006/2000A precession-nutation."
experiments = [
  "gmst_era", "frame_rotation_bpn", "equ_ecl", "equ_horizontal",
  "solar_position", "lunar_position",
  "mercury_position", "venus_position", "mars_position",
  "jupiter_position", "saturn_position", "uranus_position", "neptune_position",
  "mercury_barycenter_position", "venus_barycenter_position", "mars_barycenter_position",
  "jupiter_barycenter_position", "saturn_barycenter_position", "uranus_barycenter_position",
  "neptune_barycenter_position",
  "kepler_solver",
]
api_surface  = "public"
model        = "VSOP87 + Meeus Ch. 47 + IAU 2006/2000A"
source       = "siderust crates: bodies::*, event::lunar::meeus_ch47"
lane         = "geometric_vector"
parity       = "best-available"
support      = "supported"

[candidate.api_methods]
gmst_era                    = "siderust::astro::sidereal::gmst_iau2006 + earth_rotation_angle"
frame_rotation_bpn          = "siderust::astro::frames::precession_nutation_matrix(Iau2006A)"
equ_ecl                     = "DirectionAstroExt::to_ecliptic_of_date / to_icrs"
equ_horizontal              = "DirectionAstroExt::to_horizontal_precise / to_equatorial"
solar_position              = "EclipticMeanJ2000::<AU,Heliocentric>::CENTER.transform(jd)"
lunar_position              = "siderust::event::lunar::meeus_ch47::moon_position_meeus_ch47"
mercury_position            = "siderust::bodies::Mercury::vsop87a"
venus_position              = "siderust::bodies::Venus::vsop87a"
mars_position               = "siderust::bodies::Mars::vsop87a"
jupiter_position            = "siderust::bodies::Jupiter::vsop87a"
saturn_position             = "siderust::bodies::Saturn::vsop87a"
uranus_position             = "siderust::bodies::Uranus::vsop87a"
neptune_position            = "siderust::bodies::Neptune::vsop87a"
mercury_barycenter_position = "siderust::bodies::Mercury::vsop87a (planet-center proxy for system barycenter)"
venus_barycenter_position   = "siderust::bodies::Venus::vsop87a (planet-center proxy for system barycenter)"
mars_barycenter_position    = "siderust::bodies::Mars::vsop87a (planet-center proxy for system barycenter)"
jupiter_barycenter_position = "siderust::bodies::Jupiter::vsop87a (planet-center proxy for system barycenter)"
