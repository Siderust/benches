experiments = [
  "gmst_era", "frame_rotation_bpn", "equ_ecl", "equ_horizontal",
  "solar_position", "lunar_position",
  "mercury_position", "venus_position", "mars_position",
  "jupiter_position", "saturn_position", "uranus_position", "neptune_position",
]
