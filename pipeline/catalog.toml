mars_position       = "with solar_system_ephemeris.set('builtin'): get_body_barycentric('mars') - get_body_barycentric('earth')"
jupiter_position    = "with solar_system_ephemeris.set('builtin'): get_body_barycentric('jupiter') - get_body_barycentric('earth')"
saturn_position     = "with solar_system_ephemeris.set('builtin'): get_body_barycentric('saturn') - get_body_barycentric('earth')"
uranus_position     = "with solar_system_ephemeris.set('builtin'): get_body_barycentric('uranus') - get_body_barycentric('earth')"
neptune_position    = "with solar_system_ephemeris.set('builtin'): get_body_barycentric('neptune') - get_body_barycentric('earth')"


