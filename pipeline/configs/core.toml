# Default public suite (SOFA transforms + geometric ephemerides + kepler).
suite = "core"
n = 1000
seed = 42
adapters = ["siderust", "astropy", "libnova", "anise"]
siderust_profiles = ["iau2006a"]

[cache]
root = ".benches_cache"
auto_download = true

[kernels.de440]
enabled = true
filename = "de440.bsp"

[performance]
enabled = true
rounds = 10
scalar_n = 5000
batch_n = 100000
batch_rounds = 5
warmup = 100
timeout_s = 120

[horizons]
use_cache = true
allow_network = true

[output]
dir = "results"
publish_latest = true
allow_dirty_publish = false
allow_partial_publish = false
