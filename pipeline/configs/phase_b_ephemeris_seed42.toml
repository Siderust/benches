# Phase B ephemeris-focused baseline.
# Uses Horizons DE441 geometric vectors for Sun, Moon, and planet barycenters.

run_label = "phase-b-ephemeris-seed42"
phase = "phase-b"
tags = ["phase-b", "ephemeris", "jpl-horizons", "de441", "seed42"]

suite = "ephemeris"
n = 1000
seed = 42
adapters = ["siderust", "astropy", "libnova", "anise"]
siderust_profiles = ["iau2006a"]
no_build = false

[performance]
enabled = true
rounds = 12

[horizons]
use_cache = true
allow_network = true

[output]
dir = "results"
publish_latest = false
