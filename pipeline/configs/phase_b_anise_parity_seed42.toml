# Phase B ANISE-focused ephemeris baseline.
# Restricts adapters to the JPL-family candidates so model parity is explicit.

run_label = "phase-b-anise-parity-seed42"
phase = "phase-b"
tags = ["phase-b", "anise", "ephemeris", "same-family-jpl", "seed42"]

suite = "ephemeris"
n = 1000
seed = 42
adapters = ["siderust", "astropy", "anise"]
siderust_profiles = ["iau2006a"]
no_build = false

[performance]
enabled = true
rounds = 12

[horizons]
use_cache = true
allow_network = true

[output]
dir = "results"
publish_latest = false
