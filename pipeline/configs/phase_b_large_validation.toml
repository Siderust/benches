# Phase B large validation baseline.
# Long-running by design; use after the normal public matrix is healthy.

run_label = "phase-b-large-validation"
phase = "phase-b"
tags = ["phase-b", "large", "validation", "timing-stability"]

suite = "core"
n = 5000
seed = 42
adapters = ["siderust", "astropy", "libnova", "anise"]
siderust_profiles = ["iau2006a"]
no_build = false

[performance]
enabled = true
rounds = 20

[horizons]
use_cache = true
allow_network = true

[output]
dir = "results"
publish_latest = false
