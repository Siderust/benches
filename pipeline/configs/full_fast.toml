suite = "all"
n = 10
seed = 42
adapters = ["siderust", "astropy", "libnova", "anise"]
siderust_profiles = ["iau2006a", "iau2000a", "iau2000b", "precession_only"]
no_build = false

[performance]
enabled = true
rounds = 1
scalar_n = 50
batch_n = 50
batch_rounds = 1
warmup = 20
timeout_s = 30

[horizons]
use_cache = true
allow_network = true

[output]
dir = "results"
publish_latest = false
