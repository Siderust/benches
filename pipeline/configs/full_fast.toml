run_label = "full-fast-smoke"
run_phase = "smoke"
run_tags = ["smoke", "draft", "full_fast"]
suite = "all"
experiments = [
  "gmst_era",
  "frame_rotation_bpn",
  "equ_ecl",
  "equ_horizontal",
  "solar_position",
  "lunar_position",
  "mercury_barycenter_position",
  "venus_barycenter_position",
  "mars_barycenter_position",
  "jupiter_barycenter_position",
  "saturn_barycenter_position",
  "uranus_barycenter_position",
  "neptune_barycenter_position",
  "kepler_solver",
  "horiz_to_equ",
  "frame_bias",
  "precession",
  "nutation",
  "icrs_ecl_j2000",
  "inv_frame_bias",
  "inv_precession",
  "inv_nutation",
  "inv_bpn",
  "inv_icrs_ecl_j2000",
  "obliquity",
  "inv_obliquity",
  "bias_precession",
  "inv_bias_precession",
  "precession_nutation",
  "inv_precession_nutation",
  "inv_icrs_ecl_tod",
  "inv_equ_ecl",
]
n = 10
seed = 42
adapters = ["siderust", "astropy", "libnova", "anise"]
siderust_profiles = ["iau2006a", "iau2000a", "iau2000b", "precession_only"]
no_build = false

[cache]
root = ".benches_cache"
auto_download = true

[kernels.de440]
enabled = true
filename = "de440.bsp"

[performance]
enabled = true
rounds = 1
scalar_n = 50
batch_n = 50
batch_rounds = 1
warmup = 20
timeout_s = 30

[horizons]
use_cache = true
allow_network = false

[output]
dir = "results"
publish_latest = true
