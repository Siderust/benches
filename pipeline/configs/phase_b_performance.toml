# Phase B performance baseline.
# The orchestrator's timing workloads use scalar N=5000 and batch N=100000;
# this preset raises timing rounds for stability while keeping scoring N modest.

run_label = "phase-b-performance"
phase = "phase-b"
tags = ["phase-b", "performance", "timing-stability"]

suite = "core"
n = 500
seed = 42
adapters = ["siderust", "astropy", "libnova", "anise"]
siderust_profiles = ["iau2006a"]
no_build = false

[performance]
enabled = true
rounds = 20

[horizons]
use_cache = true
allow_network = true

[output]
dir = "results"
publish_latest = false
