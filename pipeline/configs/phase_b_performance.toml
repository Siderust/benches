run_label = "phase-b-performance"
run_phase = "phase-b"
run_tags = ["phase-b", "performance", "timing"]
suite = "ci"
n = 200
seed = 42
adapters = ["siderust", "astropy", "libnova"]
siderust_profiles = ["iau2006a"]
no_build = true

[cache]
root = ".benches_cache"
auto_download = false

[kernels.de440]
enabled = false

[performance]
enabled = true
rounds = 20
scalar_n = 5000
batch_n = 100000
batch_rounds = 5
warmup = 100
timeout_s = 120

[horizons]
use_cache = true
allow_network = false

[output]
dir = "results"
publish_latest = false
